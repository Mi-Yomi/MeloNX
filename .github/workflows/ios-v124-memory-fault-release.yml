name: GTA V v12.4 Darwin memory-fault handling release

on:
  push:
    branches: [codex/gta-v12.4-memory-fault]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta-v12.4-memory-fault-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Mi-Yomi/MeloNX' && github.ref == 'refs/heads/codex/gta-v12.4-memory-fault'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.tools/dotnet-macos
      NUGET_PACKAGES: ${{ github.workspace }}/.tools/nuget/packages
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record build request
        shell: bash
        run: |
          mkdir -p artifacts/ios/logs artifacts/test-results
          printf 'source_commit=%s\nrun_url=%s/%s/actions/runs/%s\n' \
            "$SOURCE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > artifacts/ios/build-info.txt
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          architecture: arm64
      - name: Run analyzer and release-gate regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_python_regressions.py --required distribution/ios/v12.4-required-tests.json 2>&1 | tee artifacts/test-results/python-regressions.txt
      - name: Run Swift allocation ownership and native memory diagnostic tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc src/MeloNX/MeloNX/Common/MemoryLimits/MemoryBenchmarkRun.swift \
            tests/swift/MemoryBenchmarkRunTests.swift -o artifacts/test-results/ram-tests
          artifacts/test-results/ram-tests | tee artifacts/test-results/swift-regressions.txt
          grep -Fx 'MemoryBenchmarkRunTests: 7 passed' artifacts/test-results/swift-regressions.txt
          xcrun swiftc src/MeloNX/MeloNX/Common/Diagnostics/MemoryForensics.swift \
            tests/swift/MemoryForensicsTests.swift -framework Metal -o artifacts/test-results/memory-forensic-tests
          artifacts/test-results/memory-forensic-tests | tee -a artifacts/test-results/swift-regressions.txt
          grep -Fx 'MemoryForensicsTests: 13 passed' artifacts/test-results/swift-regressions.txt
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror -arch arm64 -dynamiclib \
            tests/native/jit-breakpoint-probe.c -o artifacts/test-results/libJITBreakpointProbe.dylib
          xcrun swiftc -swift-version 6 src/MeloNX/MeloNX/Common/JIT26Breakpoint.swift \
            tests/swift/JITBreakpointTests.swift -o artifacts/test-results/JITBreakpointTests
          artifacts/test-results/JITBreakpointTests "$PWD/artifacts/test-results/libJITBreakpointProbe.dylib" \
            | tee -a artifacts/test-results/swift-regressions.txt
          grep -Fx 'JITBreakpointTests: 15 passed (actual arm64 BRK delivery, unrelated signal forwarding, exact context checks)' artifacts/test-results/swift-regressions.txt
      - name: Verify signal registration against native macOS and iOS SDK ABIs
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror -arch arm64 -dynamiclib \
            tests/native/signal-registration-probe.c -o artifacts/test-results/libSignalRegistrationProbe.dylib \
            2>&1 | tee artifacts/test-results/native-signal-build.txt
          dotnet build tests/native/SignalRegistrationProbe/SignalRegistrationProbe.csproj \
            --configuration Release --output artifacts/test-results/signal-registration-probe \
            2>&1 | tee -a artifacts/test-results/native-signal-build.txt
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          out = Path.cwd() / 'artifacts/test-results'
          helper = out / 'libSignalRegistrationProbe.dylib'
          result = {'schema_version': 1, 'status': 'failed', 'source_commit': os.environ['SOURCE_SHA'],
                    'runtime_platform': platform.system(), 'runtime_architecture': platform.machine(),
                    'helper_sha256': hashlib.sha256(helper.read_bytes()).hexdigest(),
                    'production_source_sha256': hashlib.sha256(Path('src/Ryujinx.Cpu/Signal/UnixSignalHandlerRegistration.cs').read_bytes()).hexdigest()}
          try:
              completed = subprocess.run(['dotnet', str(out / 'signal-registration-probe/SignalRegistrationProbe.dll'), str(helper)],
                                         capture_output=True, text=True, timeout=60)
              (out / 'native-signal-runtime.txt').write_text(completed.stdout + completed.stderr)
              result['exit_code'] = completed.returncode
              if completed.returncode != 0:
                  raise RuntimeError(f'native signal probe exited {completed.returncode}')
              probe = json.loads(completed.stdout)
              expected = {'schema_version': 1, 'status': 'passed', 'legacy_installed_flags': 0,
                          'candidate_installed_flags': 64, 'signals_verified': [11, 10],
                          'production_registration': True, 'saved_actions_restored': True}
              if any(probe.get(key) != value for key, value in expected.items()):
                  raise RuntimeError('native signal probe evidence missing or failed')
              result.update(status='passed', probe=probe)
          except Exception as error:
              result['error'] = str(error)
              raise
          finally:
              (out / 'native-signal-registration.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          printf 'source_commit=%s\n' "$SOURCE_SHA" > artifacts/test-results/native-signal-ios-sdk.txt
          xcrun --sdk iphoneos --show-sdk-version | tee -a artifacts/test-results/native-signal-ios-sdk.txt
          xcrun --sdk iphoneos clang -std=c11 -Wall -Wextra -Werror -arch arm64 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -fsyntax-only tests/native/signal-registration-probe.c \
            2>&1 | tee -a artifacts/test-results/native-signal-ios-sdk.txt
          printf 'iOS arm64 signal registration ABI syntax probe: passed\n' | tee -a artifacts/test-results/native-signal-ios-sdk.txt
          test -s artifacts/test-results/native-signal-registration.json
          test -s artifacts/test-results/native-signal-ios-sdk.txt
      - name: Run cache, scratch and existing graphics regressions
        shell: bash
        run: |
          set -euo pipefail
          dotnet test src/Ryujinx.Tests/Ryujinx.Tests.csproj \
            --configuration Release \
            --filter 'FullyQualifiedName~HostImportedBufferSupportTests|FullyQualifiedName~HostMemoryAllocatorLifetimeTests|FullyQualifiedName~HostImportedBufferCreationTests|FullyQualifiedName~BufferUsageBitmapTests|FullyQualifiedName~BufferPendingUploadTests|FullyQualifiedName~AutoLifetimeTests|FullyQualifiedName~BufferViewStorageIdentityTests|FullyQualifiedName~BufferCacheGrowthTests|FullyQualifiedName~PendingBufferDataTests|FullyQualifiedName~PendingBufferLifetimeTests|FullyQualifiedName~TextureGroupLifecycleTests|FullyQualifiedName~AutoDeleteCacheTests|FullyQualifiedName~MoltenVKConfigurationTests|FullyQualifiedName~CacheEvictionPolicyTests|FullyQualifiedName~DescriptorPoolSizingTests|FullyQualifiedName~VulkanMemoryTrimPolicyTests|FullyQualifiedName~VirtualBufferCopyTests|FullyQualifiedName~ThreadedRendererShutdownTests|FullyQualifiedName~ThreadedReadbackTests|FullyQualifiedName~ThreadedTextureLifetimeTests|FullyQualifiedName~PageTableReclamationTests|FullyQualifiedName~MemoryPressureMailboxTests|FullyQualifiedName~PrivateMemoryAllocatorTests|FullyQualifiedName~PrivateMappingInitializationTests|FullyQualifiedName~PrivateMemoryOwnershipTests|FullyQualifiedName~BufferCacheStabilityTests|FullyQualifiedName~MemoryPressureRecoveryTests|FullyQualifiedName~BoundedScratchPoolTests|FullyQualifiedName~CacheByRangeTests|FullyQualifiedName~ExecutionTimingTests|FullyQualifiedName~TextureFormatCensusTests|FullyQualifiedName~ThreadedAvailabilityWaitTests|FullyQualifiedName~CounterCacheTests|FullyQualifiedName~ThreadedRendererIdleTests|FullyQualifiedName~VulkanQueryProgressTests|FullyQualifiedName~GuestThreadMetadataTests|FullyQualifiedName~ConditionalRenderingFallbackTests|FullyQualifiedName~BufferForensicsTests|FullyQualifiedName~MemoryForensicSnapshotTests|FullyQualifiedName~SignalRegistrationTests|FullyQualifiedName~NativeSignalHandlerTests|FullyQualifiedName~NativePageTableTests' \
            --blame-hang-timeout 3m \
            --logger 'trx;LogFileName=gta-v12.4-regressions.trx' \
            --results-directory artifacts/test-results 2>&1 | tee artifacts/test-results/csharp-regressions.txt
      - name: Run memory tracking regressions
        shell: bash
        run: |
          set -euo pipefail
          dotnet test src/Ryujinx.Tests.Memory/Ryujinx.Tests.Memory.csproj \
            --configuration Release --blame-hang-timeout 3m \
            --logger 'trx;LogFileName=memory-v12.4-regressions.trx' \
            --results-directory artifacts/test-results 2>&1 | tee artifacts/test-results/memory-regressions.txt
      - name: Enforce complete regression evidence
        shell: bash
        run: |
          python3 tools/verify_test_results.py --required distribution/ios/v12.4-required-tests.json \
            --targeted artifacts/test-results/gta-v12.4-regressions.trx \
            --memory artifacts/test-results/memory-v12.4-regressions.trx \
            --out artifacts/test-results/verification.json
      - name: Rebuild source-locked MoltenVK and reproduce host-import regression
        shell: bash
        run: |
          set -euo pipefail
          bash distribution/ios/build-moltenvk.sh
          python3 distribution/ios/verify-moltenvk-artifact.py artifacts/moltenvk
          cp artifacts/moltenvk/host-import-regression/result.json artifacts/test-results/native-host-import.json
      - name: Build iOS package for re-signing
        env:
          MELO_MVK_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/moltenvk
        shell: bash
        run: |
          git diff --exit-code
          bash distribution/ios/build-unsigned-ipa.sh
      - name: Upload package, symbols and test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MeloNX-v12.4-memory-fault-${{ github.sha }}
          path: |
            artifacts/ios/*.ipa
            artifacts/ios/*.tar.gz
            artifacts/ios/*.txt
            artifacts/ios/*.plist
            artifacts/ios/*.entitlements
            artifacts/ios/Package.resolved
            artifacts/ios/logs/
            artifacts/moltenvk/logs/
            artifacts/moltenvk/*.json
            artifacts/moltenvk/build-status.txt
            artifacts/moltenvk/host-import-regression/**/*.json
            artifacts/moltenvk/host-import-regression/**/*.log
            artifacts/test-results/*.trx
            artifacts/test-results/*.txt
            artifacts/test-results/*.json
            artifacts/test-results/libSignalRegistrationProbe.dylib
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Publish experimental release after all gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${SOURCE_SHA:0:12}"
          TAG="gta-v12.4-memory-fault-$SHORT_SHA"
          IPA="artifacts/ios/MeloNX-$SHORT_SHA-unprovisioned.ipa"
          test -s "$IPA"
          test -s artifacts/test-results/gta-v12.4-regressions.trx
          test -s artifacts/test-results/memory-v12.4-regressions.trx
          test -s artifacts/test-results/native-signal-registration.json
          test -s artifacts/test-results/native-signal-ios-sdk.txt
          grep -Fx 'iOS arm64 signal registration ABI syntax probe: passed' artifacts/test-results/native-signal-ios-sdk.txt
          cp docs/GTA-V-V12.4-MEMORY-FAULT.ru.md artifacts/ios/RELEASE-NOTES.md
          printf '\nSource commit: `%s`\n\nCI: %s/%s/actions/runs/%s\n' \
            "$SOURCE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> artifacts/ios/RELEASE-NOTES.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          results = json.loads(Path('artifacts/test-results/verification.json').read_text())
          with Path('artifacts/ios/RELEASE-NOTES.md').open('a') as out:
              out.write('\n## CI results\n\n')
              for name, result in results.items():
                  out.write(f"- {name}: {result['outcomes']}; total {result['total']}.\n")
                  for test in result['not_run']:
                      out.write(f"  - NOT RUN: {test}\n")
              out.write(Path('artifacts/test-results/swift-regressions.txt').read_text())
              out.write(Path('artifacts/test-results/python-regressions.txt').read_text())
              signal = json.loads(Path('artifacts/test-results/native-signal-registration.json').read_text())
              if signal.get('status') != 'passed' or signal.get('source_commit') != __import__('os').environ['SOURCE_SHA']:
                  raise RuntimeError('native signal registration evidence missing, failed or for a different source')
              out.write(f"\nNative signal registration (macOS arm64): {signal['status']}; "
                        "legacy flags=0, corrected flags=64; SIGSEGV/SIGBUS delivery and restoration verified. "
                        "iOS arm64 SDK syntax check passed; this is not iPhone runtime validation.\n")
              native = json.loads(Path('artifacts/test-results/native-host-import.json').read_text())
              out.write(f"\nNative host import (macOS): {native['status']}; "
                        f"control vkCreateBuffer={native['control']['report']['host_create_result']}, "
                        f"candidate={native['candidate']['report']['host_create_result']}, "
                        f"GPU copy each direction={native['candidate']['report']['bytes_each_direction']} bytes.\n")
          PY
          gh release create "$TAG" "$IPA" artifacts/ios/*.tar.gz artifacts/ios/*.txt \
            artifacts/test-results/*.trx artifacts/test-results/*.txt artifacts/test-results/*.json \
            --target "$SOURCE_SHA" --draft --prerelease --latest=false \
            --title "MeloNX v12.4 — Darwin signal registration and fault diagnostics ($SHORT_SHA)" \
            --notes-file artifacts/ios/RELEASE-NOTES.md
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          gh release view "$TAG" --json url,assets,targetCommitish > artifacts/release.json
          cat artifacts/release.json
          echo '### Release' >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
